<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc">
<title id="title">Mapa das trilhas do Módulo 2 — Case Vitaliza</title>
<desc id="desc">Uma leitura comum apresenta o case e os dados. Três trilhas aprofundam Negócios e CRM, Ciência de Dados e ML e IA Generativa. As frentes integram diagnóstico e baseline na A1 e decisão, retorno e mensagem na A2. Gestão e qualidade acompanham todo o percurso.</desc>
